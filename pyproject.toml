[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankstress"
version = "0.1.0"
description = "Public-data credit loss forecasting and regional-bank stress research"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "PyYAML>=6", "requests>=2.31", "matplotlib>=3.8", "statsmodels>=0.14", "reportlab>=4.2", "ffiec-data-collector==2.0.0rc2"]

[project.optional-dependencies]
test = ["pytest>=8"]
bayesian = ["pymc>=5.20,<6", "arviz>=0.20,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
