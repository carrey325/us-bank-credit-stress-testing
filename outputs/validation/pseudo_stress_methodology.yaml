validation_scope: MINIMAL_R3
macro_path: supplied realized historical macro path; unavailable features are not
  imputed
lagged_nco: recursive modeled state after a valid jump-off; source period and type
  carry unchanged across unavailable predictions
bank_controls: current train-end NPL rate, allowance coverage, Tier 1 ratio, and adjacent-quarter
  loan growth held fixed; incomplete current states are excluded and counted
bank_control_source_lineage: one source-period column per frozen control in pseudo_stress.parquet;
  loan growth also records its adjacent-prior-quarter denominator component
generation_scoring_separation: true
conditional_mean_path_label: plug-in conditional-mean recursive path; not asserted
  exact expectation
fixed_quantile_feedback_label: recursive_quantile_sensitivity_not_distribution
multi_period_cumulative_loss_q90: NOT_EVALUATED
windows:
- name: GFC
  train_end: '2006-12-31'
  test_start: '2007-01-01'
  test_end: '2010-12-31'
- name: COVID
  train_end: '2019-12-31'
  test_start: '2020-01-01'
  test_end: '2021-12-31'
- name: High_Rate_CRE
  train_end: '2021-12-31'
  test_start: '2022-01-01'
  test_end: '2025-12-31'
