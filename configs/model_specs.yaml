# Frozen on 2026-09-02 before inspecting any Batch 2 estimates.
primary_outcome: annualized_nco_rate
# Mortgage NCO reporting is supported from 2005 in the repaired Batch 1 mapping;
# it remains secondary under the frozen Batch 2 primary specification.
primary_segments: [CRE, CI]
primary_cre_exposure: cre_to_tier1
primary_lags:
  nco: 1
  npl: 1
  bank_features: 1
  macro: 1
# The macro lag above is implemented exactly once in macro-series availability:
# ALFRED snapshots naturally expose the latest released value and fallback
# final-vintage series are shifted one quarter.  Model construction carries the
# origin-known value forward to the target row without another shift.
ar_baseline:
  entity_effect: bank_segment_fixed_effect
dynamic_fe_spec:
  entity_effect: bank_segment_fixed_effect
  standard_errors: bank_clustered
  bank_features: [lagged_noncurrent_ratio, lagged_allowance_coverage, lagged_loan_growth, lagged_tier1_ratio]
  segment_macro_variables:
    CRE: [lagged_cre_price_growth, lagged_gdp_growth, lagged_bbb_spread, lagged_short_rate]
    CI: [lagged_gdp_growth, lagged_bbb_spread, lagged_unemployment_rate, lagged_short_rate]
  exclude_merger_recent: true
cre_interaction_spec:
  outcome: annualized_nco_rate
  segment: CRE
  exposure: cre_to_tier1
  exposure_timing: bank_quarter_lagged_at_forecast_origin
  alternative_exposure: cre_share
  shock: cre_price_growth
  entity_effect: bank_fixed_effect
  time_effect: quarter_fixed_effect
  include_time_varying_exposure_main_effect: true
  shock_sign_convention: growth_rate_positive
  robustness:
    - {name: cre_share_alternative, exposure: cre_share, sample: full}
    - {name: pre_2022_exposure_forward, exposure: cre_to_tier1, sample: post_2021q4, exposure_as_of: '2021-12-31'}
  multiple_testing: "Primary plus two pre-authorized robustness estimates; confidence intervals are reported individually and no significance selection is performed."
exploratory_macro_fe:
  enabled: false
  declared_before_valid_corrected_results: true
  reason: "No exploratory macro-FE diagnostic is needed for the R2 gate."
oos_windows:
  - {train_start: '2005-01-01', train_end: '2011-12-31', test_start: '2012-01-01', test_end: '2016-12-31'}
  - {train_start: '2005-01-01', train_end: '2016-12-31', test_start: '2017-01-01', test_end: '2019-12-31'}
  - {train_start: '2005-01-01', train_end: '2019-12-31', test_start: '2020-01-01', test_end: '2021-12-31'}
  - {train_start: '2005-01-01', train_end: '2021-12-31', test_start: '2022-01-01', test_end: '2025-12-31'}
quantiles: [0.5, 0.75, 0.9]
quantile_spec:
  estimator: statsmodels.QuantReg
  entity_effect: bank_segment_dummies
  max_iter: 10000
  p_tol: 0.000001
  tail_threshold_quantile: 0.9
  interval: {lower_quantile: 0.5, upper_quantile: 0.9}
bayesian_core_spec:
  estimator: pymc_student_t_hierarchical
  outcome: nco_rate
  likelihood: student_t
  entity_effect: bank_segment_varying_intercept
  coefficient_structure: segment_specific
  non_centered: true
  random_seed: 772
  draws: 300
  tune: 300
  chains: 2
  target_accept: 0.9
  priors:
    standardized_intercept_sd: 2.0
    standardized_coefficient_sd: 1.0
    standardized_entity_sd: 1.0
    standardized_residual_sd: 1.0
    student_t_nu_minus_two_rate: 0.05
  convergence:
    rhat_max: 1.01
    ess_bulk_min: 100
    divergences_ideal: 0
pseudo_stress_windows:
  - {name: GFC, train_end: '2006-12-31', test_start: '2007-01-01', test_end: '2010-12-31'}
  - {name: COVID, train_end: '2019-12-31', test_start: '2020-01-01', test_end: '2021-12-31'}
  - {name: High_Rate_CRE, train_end: '2021-12-31', test_start: '2022-01-01', test_end: '2025-12-31'}
secondary_hypotheses:
  - CI losses interact with BBB spread.
  - Mortgage losses interact with unemployment and house-price growth when a sufficiently long loss series is available.
